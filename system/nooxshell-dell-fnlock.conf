# nooxshell: lets the toggles island show a Dell laptop's Fn lock (Fn+Esc).
# Installed to /etc/modprobe.d/ by install.sh, on Dells only and after asking;
# removed by uninstall.sh.

# The BIOS keeps the Fn lock as its FnLockMode setting, readable only by root.
# Make it readable when the module loads, so the shell can show the lock at
# login. The file holds just the setting's name.
install dell_wmi_sysman /usr/bin/modprobe --ignore-install dell_wmi_sysman $CMDLINE_OPTS && { /usr/bin/chmod 0444 /sys/class/firmware-attributes/*/attributes/FnLockMode/current_value 2>/dev/null; true; }

# Each Fn+Esc reaches the kernel as a dell_wmi event that the driver drops
# without a word. Its debug messages log the event, and the shell follows them
# in the kernel log. They also log the laptop's other hotkey events.
options dell_wmi dyndbg=+p
